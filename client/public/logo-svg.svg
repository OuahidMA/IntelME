<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .charcoal { fill: #24292E; }
      .charcoal-stroke { stroke: #24292E; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .off-white { fill: #F6F4EE; }
      .accent-line { fill: none; stroke: #E8E5DC; stroke-width: 10; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background Canvas (Off-White) -->
  <rect width="100%" height="100%" fill="#FAF9F6"/>

  <g transform="translate(10, 0)">
    <!-- Document Base Structure -->
    <!-- Document Body Outline -->
    <path class="charcoal-stroke" d="M 180 100 L 320 100 L 370 150 L 370 390 C 370 395.5, 365.5 400, 360 400 L 180 400 C 174.5 400, 170 395.5, 170 390 L 170 110 C 170 104.5, 174.5 100, 180 100 Z" />
    
    <!-- Top-Right Fold Corner -->
    <path class="charcoal-stroke" d="M 320 100 L 320 150 L 370 150" />

    <!-- Subtle Off-White Resume Content Lines (Behind Lens) -->
    <line x1="220" y1="185" x2="330" y2="185" class="accent-line" />
    <circle cx="205" cy="185" r="5" class="off-white" stroke="#24292E" stroke-width="4" />
    
    <line x1="220" y1="315" x2="310" y2="315" class="accent-line" />
    <circle cx="205" cy="315" r="5" class="off-white" stroke="#24292E" stroke-width="4" />

    <!-- Magnifying Glass Lens Outline (Intersecting Document) -->
    <path class="charcoal-stroke" d="M 285 180 A 70 70 0 1 0 285 320 A 70 70 0 1 0 285 180 Z" />

    <!-- Horizontal Scan Line (Analytical Cue) -->
    <line x1="150" y1="250" x2="390" y2="250" class="charcoal-stroke" stroke-width="12" />

    <!-- Scan Line Data Nodes -->
    <circle cx="225" cy="250" r="7" class="charcoal" />
    <circle cx="315" cy="250" r="7" class="charcoal" />

    <!-- Magnifying Glass Handle -->
    <path class="charcoal-stroke" stroke-width="22" d="M 180 300 L 125 355" />
  </g>
</svg>
